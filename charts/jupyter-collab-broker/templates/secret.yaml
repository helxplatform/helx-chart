{{- if not .Values.auth.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jupyter-collab-broker.fullname" . }}
  labels:
    {{- include "jupyter-collab-broker.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ required "jupyter-collab-broker: auth.token (or auth.existingSecret) is required; it must match resty's jupyterCollaboration.auth_token" .Values.auth.token | quote }}
{{- end }}
